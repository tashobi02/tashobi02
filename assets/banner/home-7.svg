<svg xmlns="http://www.w3.org/2000/svg" width="100" height="500" viewBox="940 0 100 500" role="img" aria-label="Hi, I'm Obidit Islam. Computer Science Senior, ML/AI Systems, Game AI. A console-style home screen with tiles for research, game AI, code, Arch Linux, lifting, swimming, driving and a locked upcoming project.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030816"/><stop offset=".45" stop-color="#071a45"/><stop offset="1" stop-color="#0b3c8f"/>
    </linearGradient>
    <radialGradient id="halo" cx=".78" cy=".72" r=".55">
      <stop offset="0" stop-color="#3b82f6" stop-opacity=".45"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rib" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#93c5fd" stop-opacity="0"/><stop offset=".5" stop-color="#bfdbfe" stop-opacity=".55"/><stop offset="1" stop-color="#93c5fd" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity=".35"/><stop offset=".3" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="500" rx="20"/></clipPath>
    <filter id="soft" x="-10%" y="-50%" width="120%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <linearGradient id="t0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#334155"/><stop offset="1" stop-color="#0f172a"/></linearGradient><linearGradient id="t1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f766e"/><stop offset="1" stop-color="#134e4a"/></linearGradient><linearGradient id="t2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1793d1"/><stop offset="1" stop-color="#0b3a66"/></linearGradient><linearGradient id="t3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3730a3"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient><linearGradient id="t4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0369a1"/><stop offset="1" stop-color="#082f49"/></linearGradient><linearGradient id="t5" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#475569"/><stop offset="1" stop-color="#1e293b"/></linearGradient><linearGradient id="t6" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111827"/><stop offset="1" stop-color="#030712"/></linearGradient><linearGradient id="tsel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e3a8a"/><stop offset="1" stop-color="#0e7490"/></linearGradient>
    <style>
      text { font-family: 'Segoe UI', 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
      .tab { font-size: 21px; fill: #8fa3c8; }
      .tab.on { fill: #ffffff; font-weight: 600; }
      .pin { opacity: 0; animation: cascade 1.1s ease-out forwards; }
      .drift { animation: drift ease-in-out infinite alternate; }
      .rib { animation: sway 14s ease-in-out infinite alternate; }
      .rib2 { animation: sway 19s ease-in-out infinite alternate-reverse; }
      .tin { opacity: 0; animation: rise .6s cubic-bezier(.16,1,.3,1) forwards; }
      .ui { opacity: 0; animation: rise .7s cubic-bezier(.16,1,.3,1) forwards; }
      .focus { animation: focus 2.6s ease-in-out infinite; }
      @keyframes cascade { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes drift { from { transform: translate(0,0); } to { transform: translate(var(--dx), -22px); } }
      @keyframes sway { from { transform: translateX(-60px); } to { transform: translateX(60px); } }
      @keyframes slide { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
      @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes focus { 0%,100% { stroke-opacity: 1; } 50% { stroke-opacity: .55; } }
      @media (prefers-reduced-motion: reduce) {
        .pin, .tin, .ui { animation: none; opacity: 1; }
        .drift, .rib, .rib2, .focus { animation: none; }
      }
    </style>
  </defs>

