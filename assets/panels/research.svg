<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Research and Highlights. Research interests: Affective Game Computing: Adaptive NPC behaviour, player modelling, and emotion-driven game AI (SSL, IUT); Continual Model Editing &amp; Unlearning: Sequential LLM editing via null-space–projected Cayley rotations that preserve weight geometry; Bengali NLP: Hallucination detection and safety evaluation in Bengali LLMs. Achievements: Finalist (Top 20 / 400+), IUT Agentic AI Hackathon (built AgriSense AI); 4th Place (50+ teams), HerWILL × UAP Safe Social Media Datathon 2026 (Macro F1 = 0.748); 9th Place, Bengali LLM Hallucination-Detection Datathon (Team Lead, F1 = 0.910).">
