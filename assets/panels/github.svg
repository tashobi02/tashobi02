<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="118" viewBox="0 0 1200 118" role="img" aria-label="GitHub Analytics">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#040b1f"/><stop offset=".6" stop-color="#081a45"/><stop offset="1" stop-color="#0a2d6e"/></linearGradient>
<radialGradient id="halo" cx=".85" cy=".1" r=".7"><stop offset="0" stop-color="#3b82f6" stop-opacity=".28"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></radialGradient>
<linearGradient id="rib" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#93c5fd" stop-opacity="0"/><stop offset=".5" stop-color="#bfdbfe" stop-opacity=".35"/><stop offset="1" stop-color="#93c5fd" stop-opacity="0"/></linearGradient>
<clipPath id="card"><rect width="1200" height="118" rx="20"/></clipPath>
<filter id="soft" x="-10%" y="-50%" width="120%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
<style>text{font-family:'Segoe UI', 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif}.d{animation:drift ease-in-out infinite alternate}.r{animation:sway 16s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(var(--dx),-14px)}}@keyframes sway{from{transform:translateX(-50px)}to{transform:translateX(50px)}}
@media (prefers-reduced-motion:reduce){.d,.r{animation:none}}</style>
</defs>
<g clip-path="url(#card)">
<rect width="1200" height="118" fill="url(#bg)"/><rect width="1200" height="118" fill="url(#halo)"/>
<g filter="url(#soft)"><path class="r" d="M-100 88 C 250 28, 550 128, 850 68 S 1180 38, 1300 78" stroke="url(#rib)" stroke-width="3" fill="none"/></g>
<circle class="d" cx="289" cy="20" r="2" fill="#dbeafe" style="--dx:-1px;animation-duration:6.5s;animation-delay:-0.2s;opacity:0.42"/><circle class="d" cx="351" cy="107" r="0.8" fill="#dbeafe" style="--dx:-11px;animation-duration:8.7s;animation-delay:-2.5s;opacity:0.27"/><circle class="d" cx="135" cy="31" r="0.8" fill="#dbeafe" style="--dx:13px;animation-duration:10.0s;animation-delay:-7.2s;opacity:0.28"/><circle class="d" cx="376" cy="71" r="1.5" fill="#dbeafe" style="--dx:-17px;animation-duration:9.0s;animation-delay:-6.0s;opacity:0.40"/><circle class="d" cx="220" cy="56" r="0.8" fill="#dbeafe" style="--dx:18px;animation-duration:10.1s;animation-delay:-8.5s;opacity:0.54"/><circle class="d" cx="19" cy="39" r="1.5" fill="#dbeafe" style="--dx:14px;animation-duration:8.5s;animation-delay:-3.7s;opacity:0.44"/><circle class="d" cx="519" cy="26" r="1.5" fill="#dbeafe" style="--dx:-10px;animation-duration:10.0s;animation-delay:-0.7s;opacity:0.39"/><circle class="d" cx="1187" cy="61" r="2" fill="#dbeafe" style="--dx:8px;animation-duration:6.7s;animation-delay:-6.1s;opacity:0.23"/>
<text x="56" y="72" style="font-size:30px;font-weight:600;fill:#fff">GitHub Analytics</text>
<rect x="56" y="86" width="254" height="3" rx="1.5" fill="#fff"/>

</g></svg>