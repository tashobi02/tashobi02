  <text x="420" y="132" class="line acc" style="font-size:21px; animation-delay:0.8s">obidit<tspan class="dim">@</tspan>archlinux</text>
  <rect x="420" y="144" width="190" height="2" rx="1" fill="#1793d1" class="line" style="animation-delay:0.85s"/>
    <text x="420" y="176" class="line" style="animation-delay:0.90s"><tspan class="k">OS</tspan><tspan x="540" class="v">Arch Linux x86_64</tspan></text>
    <text x="420" y="202" class="line" style="animation-delay:1.02s"><tspan class="k">Shell</tspan><tspan x="540" class="v">zsh</tspan></text>
    <text x="420" y="228" class="line" style="animation-delay:1.14s"><tspan class="k">Uni</tspan><tspan x="540" class="v">IUT Dhaka, CSE class of 2027</tspan></text>
    <text x="420" y="254" class="line" style="animation-delay:1.26s"><tspan class="k">Research</tspan><tspan x="540" class="v">Affective game AI, LLM model editing</tspan></text>
    <text x="420" y="280" class="line" style="animation-delay:1.38s"><tspan class="k">Building</tspan><tspan x="540" fill="#414868">█████████</tspan><tspan class="btw"> classified, reveal soon</tspan></text>
    <text x="420" y="306" class="line" style="animation-delay:1.50s"><tspan class="k">Stack</tspan><tspan x="540" class="v">C++, Python, TypeScript, PyTorch</tspan></text>
    <text x="420" y="332" class="line" style="animation-delay:1.62s"><tspan class="k">Hobbies</tspan><tspan x="540" class="v">Bodybuilding, swimming, driving</tspan></text>
    <text x="420" y="358" class="line" style="animation-delay:1.74s"><tspan class="k">Playing</tspan><tspan x="540" class="v">Soulsborne games</tspan></text>
    <text x="420" y="384" class="line" style="animation-delay:1.86s"><tspan class="k">Name</tspan><tspan x="540" class="v">one of the rarest in the world</tspan></text>
  <g class="line" style="animation-delay:1.98s"><rect x="420" y="404" width="30" height="16" fill="#f7768e"/><rect x="450" y="404" width="30" height="16" fill="#ff9e64"/><rect x="480" y="404" width="30" height="16" fill="#e0af68"/><rect x="510" y="404" width="30" height="16" fill="#9ece6a"/><rect x="540" y="404" width="30" height="16" fill="#73daca"/><rect x="570" y="404" width="30" height="16" fill="#7dcfff"/><rect x="600" y="404" width="30" height="16" fill="#1793d1"/><rect x="630" y="404" width="30" height="16" fill="#bb9af7"/></g>
  <text x="420" y="454" class="line" style="animation-delay:2.18s"><tspan class="dim">[</tspan><tspan class="u">obidit@archlinux</tspan><tspan class="v"> ~</tspan><tspan class="dim">]$</tspan><tspan class="btw"> # I use Arch, btw </tspan><tspan class="v cursor">█</tspan></text>
