  <line x1="6" y1="56" x2="994" y2="56" stroke="#2f334d" stroke-width="1.5"/>

  <!-- arch logo (neofetch ascii) -->
  <ellipse class="glow" cx="205" cy="270" rx="200" ry="170" fill="url(#glow)"/>
