    <text x="40" y="332.5" class="logo line" style="animation-delay:0.52s">      :osssssss/        osssso+++.</text>
    <text x="40" y="349.0" class="logo line" style="animation-delay:0.56s">     /ossssssss/        +ssssooo/-</text>
    <text x="40" y="365.5" class="logo line" style="animation-delay:0.60s">   `/ossssso+/:-        -:/+osssso+-</text>
    <text x="40" y="382.0" class="logo line" style="animation-delay:0.64s">  `+sso+:-`                 `.-/+oso:</text>
    <text x="40" y="398.5" class="logo line" style="animation-delay:0.68s"> `++:.                           `-/+/</text>
    <text x="40" y="415.0" class="logo line" style="animation-delay:0.72s"> .`                                 `/</text>
  </g>

