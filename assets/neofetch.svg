<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490" viewBox="0 0 1000 490" role="img" aria-label="neofetch on Arch Linux: obidit@archlinux. Shell zsh, IUT Dhaka CSE class of 2027, researching affective game AI and LLM model editing, building something classified, reveal soon. I use Arch, btw.">
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1793d1" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#1793d1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="archfill" gradientUnits="userSpaceOnUse" x1="0" y1="100" x2="0" y2="420">
      <stop offset="0" stop-color="#4fc3f7"/>
      <stop offset="1" stop-color="#1793d1"/>
    </linearGradient>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 17px; white-space: pre; }
      .logo { font-size: 14px; font-weight: 700; }
      .k { fill: #1793d1; font-weight: 700; }
      .v { fill: #c0caf5; }
      .dim { fill: #565f89; }
      .u { fill: #1793d1; font-weight: 700; }
      .acc { fill: #4fc3f7; font-weight: 700; }
      .btw { fill: #9ece6a; }
      .line { opacity: 0; animation: in 0.3s ease-out forwards; }
      .glow { transform-box: fill-box; transform-origin: center; animation: pulse 3.2s ease-in-out infinite; }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes in { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: translateX(0); } }
      @keyframes pulse { 0%,100% { opacity: 0.7; transform: scale(1); } 50% { opacity: 1; transform: scale(1.06); } }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .line { animation: none; opacity: 1; }
        .glow, .cursor { animation: none; }
      }
    </style>
  </defs>

  <!-- window -->
  <rect x="6" y="6" width="988" height="478" rx="14" fill="#1a1b27" stroke="#2f334d" stroke-width="1.5"/>
  <circle cx="34" cy="32" r="6.5" fill="#f7768e"/>
  <circle cx="56" cy="32" r="6.5" fill="#e0af68"/>
  <circle cx="78" cy="32" r="6.5" fill="#9ece6a"/>
