<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Obidit Islam, CS undergraduate at IUT Dhaka. Reinforcement learning, game AI, intelligent systems.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.6" stop-color="#131a33"/>
      <stop offset="1" stop-color="#1b2347"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6d5dfc" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#6d5dfc" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="1200" height="320" rx="18"/></clipPath>
    <style>
      .name { font: 700 68px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #f4f7ff; letter-spacing: -1px; }
      .role { font: 400 26px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #a9b4d0; }
      .tag  { font: 500 20px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #2dd4bf; }
      .fade { animation: fadeUp 0.9s ease-out both; }
      .stone { animation: pop 0.5s ease-out both; transform-box: fill-box; transform-origin: center; }
      @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes pop { from { opacity: 0; transform: scale(0.4); } to { opacity: 1; transform: scale(1); } }
      @media (prefers-reduced-motion: reduce) { .fade, .stone { animation: none; } }
    </style>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glow)"/>

  <!-- Go board (7x7, a nod to ZetaGo) -->
  <g stroke="#3a4770" stroke-width="1.4" stroke-linecap="round"><line x1="830" y1="40" x2="1070" y2="40"/><line x1="830" y1="40" x2="830" y2="280"/><line x1="830" y1="80" x2="1070" y2="80"/><line x1="870" y1="40" x2="870" y2="280"/><line x1="830" y1="120" x2="1070" y2="120"/><line x1="910" y1="40" x2="910" y2="280"/><line x1="830" y1="160" x2="1070" y2="160"/><line x1="950" y1="40" x2="950" y2="280"/><line x1="830" y1="200" x2="1070" y2="200"/><line x1="990" y1="40" x2="990" y2="280"/><line x1="830" y1="240" x2="1070" y2="240"/><line x1="1030" y1="40" x2="1030" y2="280"/><line x1="830" y1="280" x2="1070" y2="280"/><line x1="1070" y1="40" x2="1070" y2="280"/></g>
  <circle cx="910" cy="120" r="2.5" fill="#4a5a82"/><circle cx="910" cy="200" r="2.5" fill="#4a5a82"/><circle cx="990" cy="120" r="2.5" fill="#4a5a82"/><circle cx="990" cy="200" r="2.5" fill="#4a5a82"/>
  <circle class="stone" style="animation-delay:0.60s" cx="950" cy="160" r="15" fill="#05070d" stroke="#8b98b8" stroke-width="1.5"/><circle class="stone" style="animation-delay:0.95s" cx="990" cy="160" r="15" fill="#eef2fb" stroke="#c3cde6" stroke-width="1.5"/><circle class="stone" style="animation-delay:1.30s" cx="1030" cy="120" r="15" fill="#05070d" stroke="#8b98b8" stroke-width="1.5"/><circle class="stone" style="animation-delay:1.65s" cx="910" cy="160" r="15" fill="#eef2fb" stroke="#c3cde6" stroke-width="1.5"/><circle class="stone" style="animation-delay:2.00s" cx="870" cy="120" r="15" fill="#05070d" stroke="#8b98b8" stroke-width="1.5"/><circle class="stone" style="animation-delay:2.35s" cx="870" cy="200" r="15" fill="#eef2fb" stroke="#c3cde6" stroke-width="1.5"/><circle class="stone" style="animation-delay:2.70s" cx="990" cy="240" r="15" fill="#05070d" stroke="#8b98b8" stroke-width="1.5"/><circle class="stone" style="animation-delay:3.05s" cx="950" cy="80" r="15" fill="#eef2fb" stroke="#c3cde6" stroke-width="1.5"/><circle class="stone" style="animation-delay:3.40s" cx="910" cy="240" r="15" fill="#05070d" stroke="#8b98b8" stroke-width="1.5"/><circle class="stone" style="animation-delay:3.75s" cx="1030" cy="240" r="15" fill="#eef2fb" stroke="#c3cde6" stroke-width="1.5"/>
  <circle class="stone" style="animation-delay:4.10s" cx="1030" cy="240" r="6" fill="none" stroke="#2dd4bf" stroke-width="2"/>

  <!-- Text -->
  <g>
    <text class="name fade" x="72" y="138" style="animation-delay:0.05s">Obidit Islam</text>
    <rect x="74" y="160" width="84" height="4" rx="2" fill="url(#accent)"/>
    <text class="role fade" x="72" y="208" style="animation-delay:0.25s">CS undergraduate · IUT Dhaka</text>
    <text class="tag fade" x="72" y="252" style="animation-delay:0.45s">reinforcement learning × game AI</text>
  </g>

  <rect x="0" y="316" width="1200" height="4" fill="url(#accent)" clip-path="url(#card)"/>
</svg>
